# Замена для /etc/nginx/sites-available/coffedzhim.conf
# Подключать только после выпуска сертификата. Если файлов сертификата ещё нет,
# nginx -t завершится ошибкой и сайт не нужно перезагружать.
# Сертификат выпускается отдельно: certbot certonly --webroot, без правки nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coffedzhim.ru www.coffedzhim.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/coffedzhim;
        default_type "text/plain";
    }

    location / {
        return 301 https://coffedzhim.ru$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.coffedzhim.ru;

    ssl_certificate /etc/letsencrypt/live/coffedzhim.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffedzhim.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://coffedzhim.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coffedzhim.ru;

    ssl_certificate /etc/letsencrypt/live/coffedzhim.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffedzhim.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Включить после проверки HTTPS. Пока строка закомментирована, откат на HTTP
    # не заставит браузер ещё полгода открывать только HTTPS.
    # add_header Strict-Transport-Security "max-age=15552000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/coffedzhim;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }
}
